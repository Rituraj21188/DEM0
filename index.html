<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Point Cloud Viewer</title>
  <style>
    body { margin: 0; overflow: hidden; background: #0f1117; font-family: -apple-system, BlinkMacSystemFont, sans-serif; }
    canvas { display: block; }
    #ui {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      background: rgba(20, 24, 33, 0.85);
      backdrop-filter: blur(8px);
      padding: 12px 18px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #fff;
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 16px;
      color: #00d2ff;
      letter-spacing: 1px;
    }
    .control-group { margin-top: 8px; font-size: 13px; }
    input[type=range] { width: 120px; vertical-align: middle; }
  </style>
</head>
<body>
  <div id="loading">Loading Point Cloud...</div>
  
  <div id="ui">
    <div style="font-weight: 600; font-size: 14px;">Point Cloud Settings</div>
    <div class="control-group">
      <label>Size: <input type="range" id="size-slider" min="0.005" max="0.1" step="0.005" value="0.02"></label>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { PLYLoader } from 'three/addons/loaders/PLYLoader.js';

    // 1. Scene & Camera Setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f1117);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 2000);
    camera.position.set(0, 5, 10);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // Optional subtle grid
    const grid = new THREE.GridHelper(20, 20, 0x333e50, 0x1e2230);
    grid.position.y = -1;
    scene.add(grid);

    let pointsMaterial = null;

    // 2. Load Agisoft PLY
    const loader = new PLYLoader();
    loader.load(
      './cloud.ply',
      (geometry) => {
        // Auto-center point cloud at (0, 0, 0)
        geometry.computeBoundingBox();
        geometry.center();

        // Agisoft uses Z-up by default; rotate to match Three.js Y-up
        geometry.rotateX(-Math.PI / 2);

        // Check if colors exist, otherwise fallback to cyan
        const hasColors = geometry.hasAttribute('color');

        pointsMaterial = new THREE.PointsMaterial({
          size: 0.02,
          vertexColors: hasColors,
          color: hasColors ? 0xffffff : 0x00e5ff,
          sizeAttenuation: true
        });

        const pointCloud = new THREE.Points(geometry, pointsMaterial);
        scene.add(pointCloud);

        // Adjust camera dynamically to frame the object
        const box = geometry.boundingBox;
        const size = box.getSize(new THREE.Vector3()).length();
        camera.position.set(0, size * 0.5, size * 1.2);
        camera.lookAt(0, 0, 0);
        controls.target.set(0, 0, 0);
        controls.update();

        // Hide loading text
        document.getElementById('loading').style.display = 'none';
      },
      (xhr) => {
        const percent = Math.round((xhr.loaded / (xhr.total || 1)) * 100);
        document.getElementById('loading').innerText = `Loading: ${percent}%`;
      },
      (err) => {
        console.error('Error loading PLY:', err);
        document.getElementById('loading').innerText = 'Failed to load cloud.ply';
      }
    );

    // 3. UI Point Size Slider
    document.getElementById('size-slider').addEventListener('input', (e) => {
      if (pointsMaterial) {
        pointsMaterial.size = parseFloat(e.target.value);
      }
    });

    // 4. Resize and Render Loop
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
